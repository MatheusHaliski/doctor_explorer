spring:
  application:
    name: core-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DE_DB_URL:jdbc:postgresql://localhost:5432/doctor_explorer}
    username: ${DE_DB_USER:de}
    password: ${DE_DB_PASSWORD:de}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${DE_VALKEY_HOST:localhost}
      port: ${DE_VALKEY_PORT:6379}
  # RF13 · auditoria append-only. Sem keyspace na sessão: o CassandraSchema cria o keyspace e usa nomes qualificados.
  # Credenciais em produção pelo ambiente (SPRING_CASSANDRA_USERNAME/PASSWORD), nunca no .yml.
  cassandra:
    contact-points: ${DE_CASSANDRA_CONTACT_POINTS:localhost:9042}
    local-datacenter: ${DE_CASSANDRA_DC:datacenter1}
    connection:
      connect-timeout: 10s
      init-query-timeout: 10s
    request:
      timeout: 10s
  # Sessão: SessionConfig (@EnableRedisIndexedHttpSession, 60 min, namespace de:session)
  mvc:
    problemdetails:
      enabled: true
  web:
    locale: pt_BR
    locale-resolver: fixed

server:
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

doctor-explorer:
  # Base64 de 32+ bytes; obrigatório fora dos perfis dev/it (AppSecretValidator recusa subir sem ele).
  app-secret: ${DE_APP_SECRET:}
  session:
    absolute-timeout: 24h
    # Cookie da sessão opaca (SessionConfig): HttpOnly, Secure, SameSite=Lax, Path=/, sem Max-Age.
    cookie-name: __Host-de_session
    cookie-secure: true
  terms:
    version: "2026-10-24"
    privacy-version: "2026-10-24"
  jobs:
    erasure-cron: "0 15 3 * * *"
  cassandra:
    keyspace: ${DE_CASSANDRA_KEYSPACE:de_audit}
    # produção: NetworkTopologyStrategy com 3 réplicas por região (ADR-011)
    replication: "${DE_CASSANDRA_REPLICATION:{'class': 'NetworkTopologyStrategy', 'sa-east-1': 3}}"
  # S3 (AWS em produção; credenciais pelo papel da tarefa, nunca no .yml). Buckets com Object Lock nas exportações.
  storage:
    endpoint: ${DE_S3_ENDPOINT:}
    public-endpoint: ${DE_S3_PUBLIC_ENDPOINT:}
    region: ${DE_S3_REGION:sa-east-1}
    access-key: ${DE_S3_ACCESS_KEY:}
    secret-key: ${DE_S3_SECRET_KEY:}
    path-style: ${DE_S3_PATH_STYLE:false}
    create-buckets: false
    server-side-encryption: true
  # RF08 · clinical-api na rede interna (o navegador nunca fala com ela direto)
  clinical:
    base-url: ${DE_CLINICAL_BASE_URL:http://localhost:8081}
    timeout: 15s
  # RF05 · anonimização de mídia. Tesseract e libheif vêm da imagem base (infra/images/core-api-base).
  media:
    max-image-bytes: 20971520
    max-dicom-bytes: 52428800
    max-pixels: 40000000
    ocr-languages: por+eng
    ocr-min-confidence: 30
    # origem do web (PUT direto do navegador na quarentena), separada por vírgula
    cors-origins: ${DE_MEDIA_CORS_ORIGINS:}
