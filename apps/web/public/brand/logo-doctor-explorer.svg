<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-labelledby="t d">
  <title id="t">Doctor Explorer</title>
  <desc id="d">Logo oficial: médico de jaleco com estetoscópio sobre mapa verde, pin com cruz e lupa, dentro de um anel azul, sobre a faixa com o nome Doctor Explorer.</desc>
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3D8BF2"/><stop offset="1" stop-color="#0F5BD6"/>
    </linearGradient>
    <linearGradient id="banner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A7BEF"/><stop offset="1" stop-color="#0D55CC"/>
    </linearGradient>
    <linearGradient id="mapA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4CC25E"/><stop offset="1" stop-color="#2E9E44"/>
    </linearGradient>
    <linearGradient id="mapB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3BAF50"/><stop offset="1" stop-color="#23893A"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2563F"/><stop offset="1" stop-color="#D93322"/>
    </linearGradient>
    <radialGradient id="glass" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D6E2EE"/>
    </radialGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E6EBF2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0B2A5B" flood-opacity=".22"/>
    </filter>
    <clipPath id="inner"><circle cx="320" cy="168" r="128"/></clipPath>
  </defs>

  <!-- emblema -->
  <g filter="url(#shadow)">
    <circle cx="320" cy="168" r="136" fill="#FFFFFF"/>
    <g clip-path="url(#inner)">
      <!-- mapa dobrado -->
      <path d="M226 122 L286 104 L286 236 L226 254 Z" fill="url(#mapA)"/>
      <path d="M286 104 L346 122 L346 254 L286 236 Z" fill="url(#mapB)"/>
      <path d="M346 122 L410 104 L410 236 L346 254 Z" fill="url(#mapA)"/>
      <path d="M226 122 L286 104 L346 122 L410 104" fill="none" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="3" stroke-linejoin="round"/>
      <!-- médico -->
      <path d="M232 240 C232 196 254 172 290 166 L322 166 C358 172 378 196 378 240 Z" fill="url(#coat)" stroke="#D3DCE8" stroke-width="2"/>
      <path d="M290 166 L306 200 L322 166 Z" fill="#1E6FE0"/>
      <path d="M290 166 L298 212 M322 166 L314 212" stroke="#C9D3E0" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="306" cy="126" r="34" fill="url(#coat)" stroke="#D3DCE8" stroke-width="2"/>
      <ellipse cx="294" cy="112" rx="11" ry="7" fill="#FFFFFF" opacity=".9"/>
      <!-- estetoscópio -->
      <path d="M284 168 C266 186 258 210 270 226 M270 226 C276 232 286 232 288 224" fill="none" stroke="#1E6FE0" stroke-width="7" stroke-linecap="round"/>
      <circle cx="263" cy="226" r="5" fill="#1E6FE0"/>
      <circle cx="280" cy="229" r="5" fill="#1E6FE0"/>
      <path d="M328 168 C344 182 350 196 350 206" fill="none" stroke="#1E6FE0" stroke-width="7" stroke-linecap="round"/>
      <circle cx="350" cy="216" r="12" fill="#FFFFFF" stroke="#1E6FE0" stroke-width="6"/>
    </g>
    <!-- pin com cruz -->
    <path d="M396 70 C374 70 358 86 358 106 C358 132 396 160 396 160 C396 160 434 132 434 106 C434 86 418 70 396 70 Z" fill="url(#pin)"/>
    <rect x="389" y="88" width="14" height="38" rx="3" fill="#FFFFFF"/>
    <rect x="377" y="100" width="38" height="14" rx="3" fill="#FFFFFF"/>
    <!-- anel -->
    <circle cx="320" cy="168" r="136" fill="none" stroke="url(#ring)" stroke-width="16"/>
    <!-- lupa -->
    <path d="M394 232 L424 266" stroke="#0F5BD6" stroke-width="16" stroke-linecap="round"/>
    <circle cx="370" cy="206" r="30" fill="url(#glass)" stroke="#1E6FE0" stroke-width="10"/>
  </g>

  <!-- faixa com o nome -->
  <g filter="url(#shadow)">
    <rect x="70" y="308" width="500" height="104" rx="26" fill="url(#banner)"/>
    <rect x="84" y="314" width="472" height="22" rx="11" fill="#FFFFFF" opacity=".14"/>
    <text x="320" y="380" text-anchor="middle" font-family="Nunito, 'Varela Round', 'Arial Rounded MT Bold', system-ui, sans-serif" font-weight="800" font-size="58" fill="#FFFFFF" letter-spacing=".5">Doctor Explorer</text>
  </g>
</svg>
