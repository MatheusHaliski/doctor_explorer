version: 2
updates:
  - package-ecosystem: maven
    directory: /apps/core-api
    schedule:
      interval: weekly
    groups:
      spring:
        patterns: ["org.springframework*"]
  - package-ecosystem: maven
    directory: /apps/clinical-api
    schedule:
      interval: weekly
    groups:
      spring:
        patterns: ["org.springframework*"]
      hapi:
        patterns: ["ca.uhn.hapi.fhir*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
