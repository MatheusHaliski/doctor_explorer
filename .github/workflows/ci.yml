name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: core-api · JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [21, 25]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: "Ferramentas da anonimização de mídia (RF05: OCR e HEIC)"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-por libheif-examples libheif-plugin-libde265 libheif-plugin-x265
      - name: mvn verify (unitários + *IT com Testcontainers)
        working-directory: apps/core-api
        run: mvn -B -ntp verify
      - name: SBOM (CycloneDX)
        if: matrix.java == 21
        working-directory: apps/core-api
        run: mvn -B -ntp -DskipTests org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
      - uses: actions/upload-artifact@v4
        if: matrix.java == 21
        with:
          name: sbom-core-api
          path: apps/core-api/target/bom.json

  clinical:
    name: clinical-api · JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [21, 25]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: "pdfsig (Poppler): conferência independente da assinatura PAdES"
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: mvn verify (unitários + EhrIT, DocumentIT e FhirValidationIT com PostgreSQL real)
        working-directory: apps/clinical-api
        run: mvn -B -ntp verify
      - name: SBOM (CycloneDX)
        if: matrix.java == 21
        working-directory: apps/clinical-api
        run: mvn -B -ntp -DskipTests org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
      - uses: actions/upload-artifact@v4
        if: matrix.java == 21
        with:
          name: sbom-clinical-api
          path: apps/clinical-api/target/bom.json

  docs-por-rf:
    name: Docs por RF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @mermaid-js/mermaid-cli@11
      - name: Doc atualizado quando o código do RF muda + Mermaid renderiza
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "$BASE" 2>/dev/null || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE=$(git rev-list --max-parents=0 HEAD | tail -1); fi
          python3 scripts/docs_por_rf.py --base "$BASE" --head HEAD

  design:
    name: Contraste + protótipo
    # ubuntu-latest já é 26.04 e o Playwright ainda não instala o Chromium nele
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Contraste WCAG dos tokens
        run: python3 scripts/wcag_contrast.py
      - name: Contraste do texto sobre as artes de fundo (véu mínimo + painel de leitura)
        run: pip install pillow==12.3.0 && python3 scripts/background_contrast.py --min-veil 20 --panel 92
      - name: Ícones regenerados batem com o repositório
        run: python3 design/icons/build_icons.py && git diff --exit-code -- design/icons
      - name: Playwright
        run: npm install playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Render do protótipo + testes de fumaça
        run: PLAYWRIGHT_ROOT=$PWD/node_modules node design/prototype/render.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: prototype-shots
          path: design/prototype/shots

  web:
    name: apps/web · typecheck, lint, testes, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Ícones e tokens do web são cópias fiéis de design/
        run: |
          diff -r design/icons/nav apps/web/public/icons/nav
          diff -r design/icons/topbar apps/web/public/icons/topbar
          diff design/prototype/tokens.css apps/web/styles/tokens.css
          diff design/brand/logo-mark.svg apps/web/public/brand/logo-mark.svg
          for f in design/brand/backgrounds/*.webp; do cmp "$f" "apps/web/public/backgrounds/$(basename "$f")"; test -f "apps/web/public/backgrounds/thumbs/$(basename "$f")"; done
      - name: typecheck + lint + vitest + next build
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm check

  web-e2e:
    name: apps/web · e2e no navegador (API real)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Infra do compose.yaml (PostGIS, Valkey, Cassandra da auditoria, Garage S3 com buckets)
        run: |
          docker compose up -d
          for i in $(seq 1 60); do docker compose ps cassandra --format '{{.Status}}' | grep -q healthy && break; sleep 5; done
          docker compose ps
      - name: "Ferramentas da anonimização de mídia (RF05: OCR e HEIC)"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-por libheif-examples libheif-plugin-libde265 libheif-plugin-x265
      - name: core-api (perfil dev) em segundo plano
        working-directory: apps/core-api
        run: |
          mvn -B -ntp -DskipTests package
          SPRING_PROFILES_ACTIVE=dev nohup java -jar target/core-api-*.jar > "$RUNNER_TEMP/api.log" 2>&1 &
      - name: clinical-api (perfil dev) em segundo plano
        working-directory: apps/clinical-api
        run: |
          mvn -B -ntp -DskipTests package
          SPRING_PROFILES_ACTIVE=dev nohup java -jar target/clinical-api-*.jar > "$RUNNER_TEMP/clinical.log" 2>&1 &
      - name: web (next build + start) em segundo plano
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          API_ORIGIN: http://localhost:8080
        run: |
          pnpm build
          nohup pnpm start -p 3000 > "$RUNNER_TEMP/web.log" 2>&1 &
      - name: Playwright
        run: npm install playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Esperar API e web
        run: |
          for i in $(seq 1 60); do curl -sf http://localhost:8080/api/v1/ping >/dev/null && curl -sf http://localhost:8081/actuator/health >/dev/null && curl -sf http://localhost:3000/login >/dev/null && exit 0; sleep 2; done
          echo "API, clinical-api ou web não subiram"; tail -50 "$RUNNER_TEMP/api.log" "$RUNNER_TEMP/clinical.log" "$RUNNER_TEMP/web.log"; exit 1
      - name: Fluxo ponta a ponta
        working-directory: apps/web
        env:
          API_LOG: ${{ runner.temp }}/api.log
          SHOTS: ${{ runner.temp }}/shots
          PLAYWRIGHT_ROOT: ${{ github.workspace }}/node_modules
        run: node e2e/flow.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-e2e
          path: |
            ${{ runner.temp }}/shots
            ${{ runner.temp }}/api.log
            ${{ runner.temp }}/clinical.log
            ${{ runner.temp }}/web.log

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript, python]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - name: Build Java para o CodeQL (core-api e clinical-api)
        if: matrix.language == 'java-kotlin'
        run: |
          (cd apps/core-api && mvn -B -ntp -DskipTests package)
          (cd apps/clinical-api && mvn -B -ntp -DskipTests package)
      - uses: github/codeql-action/autobuild@v3
        if: matrix.language != 'java-kotlin'
      - uses: github/codeql-action/analyze@v3

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  trivy:
    name: Trivy (imagem e repositório)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Imagens com Jib (sem Dockerfile)
        run: |
          (cd apps/core-api && mvn -B -ntp -DskipTests compile jib:dockerBuild -Djib.to.image=core-api:ci)
          (cd apps/clinical-api && mvn -B -ntp -DskipTests compile jib:dockerBuild -Djib.to.image=clinical-api:ci)
      - name: Instalar Trivy (script oficial)
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
      - name: Trivy nas imagens
        run: |
          trivy image --format sarif --output trivy-image.sarif --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 core-api:ci
          trivy image --format sarif --output trivy-image-clinical.sarif --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 clinical-api:ci
      - name: Trivy no repositório
        run: trivy fs --format sarif --output trivy-fs.sarif --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 .
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image-clinical.sarif
          category: trivy-image-clinical
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
